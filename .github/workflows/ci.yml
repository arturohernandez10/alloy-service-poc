name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run unit tests
        run: mvn -B -q test
      - name: Package (skip tests)
        run: mvn -B -q -DskipTests package

  docker-build-selfcheck:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build jar
        run: mvn -B -q -DskipTests package
      - name: Build image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/alloy-service-poc
          docker build -t $IMAGE:sha-${{ github.sha }} -t $IMAGE:latest .
      - name: Self-check
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/alloy-service-poc
          docker run --rm $IMAGE:sha-${{ github.sha }} --self-check
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/alloy-service-poc
          docker push $IMAGE:sha-${{ github.sha }}
          docker push $IMAGE:latest


